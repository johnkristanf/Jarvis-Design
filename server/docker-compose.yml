services:
    app:
        image: johnkristan/jarvis-designs:latest
        container_name: jarvis_designs_api_server
        restart: always
        ports:
            - "9000:9000"
        env_file:
            - .env
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 30s
            timeout: 10s
            retries: 3
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./default.conf:/etc/nginx/conf.d/default.conf:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro   # full dir, symlinks resolve correctly
            - /var/www/certbot:/var/www/certbot       # no :ro, certbot must write here
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
