name: Jarvis Design Deployment

on:
  push:
    branches:
      - production

env:
  EC2_SERVER_DIR: /home/${{ secrets.EC2_USER }}/server
  EC2_SSH_ADDRESS: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
  DOCKER_GPG_URL: https://download.docker.com/linux/ubuntu/gpg
  DOCKER_GPG_PATH: /etc/apt/keyrings/docker.gpg
  DOCKER_REPO_URL: https://download.docker.com/linux/ubuntu
  DOCKER_REPO_LIST: /etc/apt/sources.list.d/docker.list

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build and publish the Docker image
  # ─────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t johnkristan/jarvis-designs:latest ./server -f ./server/Dockerfile

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Push Docker Image to Docker Hub
        run: docker push johnkristan/jarvis-designs:latest

  # ─────────────────────────────────────────
  # JOB 2: Deploy to EC2
  # ─────────────────────────────────────────
  production:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # CONFIGURE — generate .env and upload all files first
      - name: Create Environment Variable for EC2
        uses: ./.github/actions/config-env
        with:
          app_key: ${{ secrets.APP_KEY }}
          db_connection: ${{ secrets.DB_CONNECTION }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_host: ${{ secrets.DB_HOST }}
          db_password: ${{ secrets.DB_PASSWORD }}
          db_port: ${{ secrets.DB_PORT }}
          db_username: ${{ secrets.DB_USERNAME }}
          pusher_app_id: ${{ secrets.PUSHER_APP_ID }}
          pusher_app_key: ${{ secrets.PUSHER_APP_KEY }}
          pusher_app_secret: ${{ secrets.PUSHER_APP_SECRET }}
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          mail_username: ${{ secrets.MAIL_USERNAME }}
          mail_password: ${{ secrets.MAIL_PASSWORD }}
          mail_from_address: ${{ secrets.MAIL_FROM_ADDRESS }}
          sentry_laravel_dsn: ${{ secrets.SENTRY_LARAVEL_DSN }}
          sentry_traces_sample_rate: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}

      - name: Upload Config Files to EC2
        uses: ./.github/actions/upload-config-files
        with:
          ec2_secret_key: ${{ secrets.EC2_KEY }}
          ec2_ssh_address: ${{ env.EC2_SSH_ADDRESS }}
          ec2_server_directory: ${{ env.EC2_SERVER_DIR }}
          files_to_upload: "server/docker-compose.yml server/default.conf .env"

      # PROVISION — ensure server dependencies exist
      - name: Provision EC2
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            mkdir -p ${{ env.EC2_SERVER_DIR }}
            sudo mkdir -p /var/www/certbot

            # Install Docker
            if ! command -v docker &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL "${{ env.DOCKER_GPG_URL }}" | sudo gpg --dearmor -o "${{ env.DOCKER_GPG_PATH }}"
              sudo chmod a+r "${{ env.DOCKER_GPG_PATH }}"
              echo "deb [arch=$(dpkg --print-architecture) signed-by=${{ env.DOCKER_GPG_PATH }}] ${{ env.DOCKER_REPO_URL }} $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee "${{ env.DOCKER_REPO_LIST }}" > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
              sudo usermod -aG docker $USER
            fi

            if ! docker compose version &> /dev/null; then
              sudo apt-get install -y docker-compose-plugin
            fi

            # Install Certbot
            if ! command -v certbot &> /dev/null; then
              sudo apt update && sudo apt install -y snapd
              sudo snap install core && sudo snap refresh core
              sudo snap install --classic certbot
              sudo ln -sf /snap/bin/certbot /usr/bin/certbot
            fi

      # DEPLOY — pull, certify, run
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            DOMAIN="${{ secrets.API_DOMAIN }}"
            EMAIL="${{ secrets.CERTBOT_EMAIL }}"
            CERT_DIR="/etc/letsencrypt/live/$DOMAIN"
            WEBROOT="/var/www/certbot"

            cd ${{ env.EC2_SERVER_DIR }}

            # Pull latest image
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker compose pull

            # Ensure nginx can start — create dummy cert only if no cert exists at all
            if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
              sudo mkdir -p "$CERT_DIR"
              sudo openssl req -x509 -nodes -newkey rsa:2048 \
                -keyout "$CERT_DIR/privkey.pem" \
                -out "$CERT_DIR/fullchain.pem" \
                -days 1 -subj "/CN=$DOMAIN"
              echo "Dummy cert created for first boot."
            fi

            # Start all containers with latest image
            docker compose down || true
            docker compose up -d --remove-orphans
            sleep 3

            # Assert nginx is up
            if ! docker compose ps nginx | grep -q "Up"; then
              docker compose logs nginx
              exit 1
            fi

            # Assert webroot is reachable
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$DOMAIN/.well-known/acme-challenge/test)
            if [ "$STATUS" = "000" ]; then
              echo "Webroot not reachable."
              exit 1
            fi

            # Issue or renew cert
            ISSUER=$(sudo openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -issuer 2>/dev/null || echo "none")
            if echo "$ISSUER" | grep -q "Let's Encrypt"; then
              sudo certbot certonly --webroot -w "$WEBROOT" \
                --non-interactive --agree-tos --keep-until-expiring \
                -m "$EMAIL" -d "$DOMAIN"
            else
              sudo certbot certonly --webroot -w "$WEBROOT" \
                --non-interactive --agree-tos --force-renewal \
                -m "$EMAIL" -d "$DOMAIN"
            fi

            # Reload nginx with real cert
            docker exec nginx nginx -s reload

            # Assert real cert is active
            FINAL_ISSUER=$(sudo openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -issuer)
            if ! echo "$FINAL_ISSUER" | grep -q "Let's Encrypt"; then
              echo "Cert is not from Let's Encrypt. Aborting."
              exit 1
            fi

            echo "✅ Deployment complete."
            docker compose ps